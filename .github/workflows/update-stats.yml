name: Update GitHub Stats

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Update Stats
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const readme = fs.readFileSync('README.md', 'utf8');
            
            // Get stats via GraphQL
            const query = `
              query($login: String!) {
                user(login: $login) {
                  starredRepositories { totalCount }
                  repositories(ownerAffiliations: OWNER, isFork: false, first: 100) { totalCount }
                  contributionsCollection {
                    totalCommitContributions
                  }
                }
              }
            `;
            
            const result = await github.graphql(query, { login: context.repo.owner });
            const user = result.user;
            
            const stars = user.starredRepositories.totalCount;
            const repos = user.repositories.totalCount;
            const commits = user.contributionsCollection.totalCommitContributions;
            const today = new Date().toISOString().split('T')[0];
            const year = new Date().getFullYear();
            
            // Update README
            let updated = readme
              .replace(/⭐ Stars Given \| \d+/, `⭐ Stars Given | ${stars}`)
              .replace(/📁 Public Repos \| \d+/, `📁 Public Repos | ${repos}`)
              .replace(/🔭 Total Commits \(\d+\) \| \d+/, `🔭 Total Commits (${year}) | ${commits}`)
              .replace(/Last updated: [\d-]+/, `Last updated: ${today}`);
            
            fs.writeFileSync('README.md', updated);
            
            // Git config and commit
            const { execSync } = require('child_process');
            execSync('git config user.email "action@github.com"');
            execSync('git config user.name "GitHub Action"');
            execSync('git add README.md');
            
            try {
              execSync('git diff --staged --quiet');
              console.log('No changes to commit');
            } catch {
              execSync(`git commit -m "Update stats - ${today}"`);
              execSync('git push');
            }
